<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>병사 후면 데모 v1</title><style>*{box-sizing:border-box}body{margin:0;background:#17202a;color:#edf2fa;font:16px/1.7 "Malgun Gothic",sans-serif}main{max-width:1180px;padding:24px 16px;margin:auto}h1{font-size:26px}button{padding:8px 14px;background:#34445a;border:1px solid #718298;color:inherit;border-radius:7px;cursor:pointer}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}article{min-width:0;background:#253144;border:1px solid #4b5b70;border-radius:12px;padding:16px}.pair{display:flex;gap:10px;justify-content:center}.pose{min-width:0;flex:1;text-align:center}.stage{height:270px;display:flex;align-items:flex-end;justify-content:center;background-color:#202630;background-image:conic-gradient(#303945 25%,transparent 0 50%,#303945 0 75%,transparent 0);background-size:20px 20px;padding:10px}canvas{image-rendering:pixelated;max-width:100%;object-fit:contain}.sizes{display:flex;align-items:flex-end;gap:18px;height:110px}.light .stage{background:#e2dccf}.dark .stage{background:#111}a{color:#aed3ff}small{color:#b8c6d9}</style><main><section style="padding:16px;margin:16px 0;border:1px solid #8d8465;border-radius:10px"><strong>후속 공통 아트 원칙</strong><p>마법사뿐 아니라 모든 플레이어 외 인물을 주인공과 구분합니다. 머리·의상·장비·실루엣은 추후 검토하며, 작은 크기와 뒷모습에서도 구분되어야 합니다. 현재 그림은 유지합니다.</p></section><h1>궁수 · 총병 · 대포병 후면 데모</h1><p>기존 제복·머리·장비와 약 2.2등신 도트 비율 유지. 정적 포즈 · 투명 PNG · 게임 반영 전 검토본.</p><p><button data-bg="check">격자</button> <button data-bg="light">밝은 배경</button> <button data-bg="dark">어두운 배경</button> <a href="README.md">제작 기록</a></p><section id="cards"></section><p id="result">이미지 로딩 중</p></main><script>
const people=[['archer','궁수','갈색 머리 · 남색/크림 제복 · 활과 등 뒤 화살통'],['gunner','총병','짙은 갈색 머리 · 금색 테두리 · 한쪽 견갑 · 목제 총'],['cannon_crew','대포병','검은 머리 · 작업 앞치마 등끈 · 장갑 · 장전봉']];let loaded=0;
function draw(img,canvas,height){const buf=document.createElement('canvas');buf.width=img.naturalWidth;buf.height=img.naturalHeight;const b=buf.getContext('2d');b.drawImage(img,0,0);const a=b.getImageData(0,0,buf.width,buf.height).data;let x0=buf.width,y0=buf.height,x1=0,y1=0;for(let y=0;y<buf.height;y++)for(let x=0;x<buf.width;x++)if(a[(y*buf.width+x)*4+3]>32){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}const w=x1-x0+1,h=y1-y0+1;canvas.height=height;canvas.width=Math.max(1,Math.round(height*w/h));canvas.style.height=height+'px';canvas.style.width=canvas.width+'px';let ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,x0,y0,w,h,0,0,canvas.width,height)}
for(const [id,label,desc]of people){const card=document.createElement('article');card.innerHTML='<h2>'+label+'</h2><small>'+desc+'</small><div class="pair"><div class="pose"><p>기존 정면</p><div class="stage"><canvas class="front"></canvas></div></div><div class="pose"><p>후면 데모</p><div class="stage"><canvas class="back"></canvas></div></div></div><p>후면 작은 크기: 32 / 48 / 64px</p><div class="sizes"></div><p><a href="'+id+'_back.png">투명 PNG 원본</a></p>';document.querySelector('#cards').append(card);for(const side of ['front','back']){let img=new Image;img.onload=()=>{draw(img,card.querySelector('.'+side),220);if(side==='back')for(const h of [32,48,64]){let c=document.createElement('canvas');card.querySelector('.sizes').append(c);draw(img,c,h)}document.querySelector('#result').textContent='이미지 '+(++loaded)+'/6 로드 완료';};img.onerror=()=>{document.querySelector('#result').textContent='이미지 로드 실패: '+img.src};img.src=side==='front'?'../codex_character_pixel_v2/'+id+'.png':id+'_back.png'}}
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>document.body.className=b.dataset.bg);
</script></html>
