<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대포 사격구 성벽</title><style>*{box-sizing:border-box}body{margin:0;background:#17222c;color:#f0f3f6;font:15px/1.7 'Malgun Gothic',sans-serif}main{max-width:1300px;margin:auto;padding:24px}button,select,input{font:inherit}button,select{padding:7px 13px;background:#34536a;border:1px solid #8398a8;color:white;border-radius:6px;cursor:pointer}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.panel,.asset{padding:18px;background:#253746;border:1px solid #4d6474;border-radius:12px;margin:20px 0}canvas{display:block;width:100%;height:auto;background:#535f46;image-rendering:pixelated;margin:16px 0;border-radius:8px}.status{background:#172833;padding:10px}.asset img{width:100%;height:auto;image-rendering:pixelated;background:#d6d1c4;display:block}.asset h2{margin-top:0}a{color:#ffe2a4;margin-right:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#bdcbd5}.asset .view{aspect-ratio:3/1;overflow:hidden;position:relative}.asset .view img{position:absolute;inset:0;height:100%;object-fit:cover}button:focus-visible{outline:3px solid #ffdc8d}@media(max-width:650px){main{padding:12px}h1{font-size:24px}.controls label{max-width:100%}}</style><main><h1>대포는 넓은 사격구 사이로</h1><p class="muted">병사는 양쪽 성벽 위 통로, 대포는 가운데 전용 사격구. 기존 대포 3방향과 새 성벽·앞난간 2종을 겹쳐 보는 검토 자료입니다.</p><section class="panel"><div class="controls"><label>조준 <select id="aim"><option value="0">왼쪽</option><option value="1" selected>중앙</option><option value="2">오른쪽</option></select></label><button id="fire">포탄 발사</button><button id="reset">배치 초기화</button><label><input id="front" type="checkbox" checked> 앞난간 겹침</label><label><input id="soldiers" type="checkbox" checked> 병사 참고 배치</label></div><div class="controls"><label>대포 높이 <input id="gunY" type="range" min="300" max="470" value="410"></label><label>난간 높이 <input id="railY" type="range" min="150" max="350" value="250"></label><label>대포 크기 <input id="size" type="range" min="50" max="90" value="70"></label></div><p id="status" class="status">준비 중</p><canvas id="scene" width="1100" height="650" aria-label="대포가 넓은 사격구를 통해 조준하는 겹침 화면"></canvas><p class="muted">가운데 낮은 턱은 대포 뒤, 좌우 높은 돌 난간은 대포 앞에 그립니다. 사격구 폭·포신·가림을 보는 시안이며 물리 충돌이나 실제 게임 배치 확정은 아닙니다.</p></section><div id="assets"></div><details><summary>MD 제작 기록·규격</summary><pre>__MD__</pre></details></main><script>
const assets=__ASSETS__;const images={};let loaded=false,aim=1,shots=[],count=0,last=null;
const c=document.getElementById('scene').getContext('2d');const get=id=>document.getElementById(id),names=['왼쪽','중앙','오른쪽'],ids=['cannon_left','cannon_center','cannon_right'];
function status(){get('status').textContent=names[aim]+' 조준 · '+count+'회 발사 · 진행 중 '+shots.length+'발 · 앞난간 '+(get('front').checked?'표시':'숨김')+' · 대포높이 '+get('gunY').value;}
for(const id of ['wall_cannon_bay','parapet_cannon_front']){const a=assets[id],section=document.createElement('section');section.className='asset';const h=document.createElement('h2');h.textContent=a.label;section.append(h);const view=document.createElement('div');view.className='view';const img=document.createElement('img');img.src=a.image;img.alt=a.label;view.append(img);section.append(view);const note=document.createElement('p');note.textContent='1024×512 RGBA · 정적 1칸 · 중앙 U자 사격구 투명';section.append(note);for(const [label,url,name]of [['포장 PNG',a.image,id+'.png'],['생성 원본',a.source,id+'_source.png'],['규격 JSON',a.json,id+'.json']]){const link=document.createElement('a');link.href=url;link.download=name;link.textContent=label;section.append(link);}get('assets').append(section);}
Promise.all(Object.entries(assets).map(([id,a])=>new Promise((res,rej)=>{const img=new Image();img.onload=()=>{images[id]=img;res();};img.onerror=rej;img.src=a.image;}))).then(()=>{loaded=true;status();}).catch(()=>get('status').textContent='이미지를 읽지 못했습니다. 다시 열어주세요.');
get('aim').onchange=()=>{aim=Number(get('aim').value);status();};for(const id of ['gunY','railY','size','front','soldiers'])get(id).oninput=status;
get('fire').onclick=()=>{if(!loaded)return;const sc=Number(get('size').value)/100,foot=Number(get('gunY').value);shots.push({x:550+[-101,0,109][aim]*sc,y:foot+(55-352)*sc,dx:[-220,0,220][aim],age:0});count++;status();};
get('reset').onclick=()=>{aim=1;shots=[];count=0;get('aim').value='1';get('gunY').value='410';get('railY').value='250';get('size').value='70';get('front').checked=true;get('soldiers').checked=true;status();};
function draw(now){const dt=last===null?0:Math.min(.1,(now-last)/1000);last=now;if(loaded){c.imageSmoothingEnabled=false;c.fillStyle=c.createPattern(images.ground,'repeat');c.fillRect(0,0,1100,650);c.fillStyle='#13231077';c.fillRect(0,0,1100,650);
 const b=assets.wall_cannon_bay.rect,wallH=1100*b[3]/b[2];c.drawImage(images.wall_cannon_bay,...b,0,330,1100,wallH);
 const r=assets.parapet_cannon_front.rect,ry=Number(get('railY').value),rw=1000,rh=rw*r[3]/r[2];c.drawImage(images.parapet_cannon_front,...r,50,ry,rw,rh);
 // 원본 성벽의 가운데 낮은 석재 발판 면을 검토용 플랫폼으로 배치한다.
 c.drawImage(images.wall_cannon_bay,b[0]+b[2]*.36,b[1]+b[3]*.37,b[2]*.28,b[3]*.09,340,340,420,130);
 const sc=Number(get('size').value)/100,foot=Number(get('gunY').value);c.drawImage(images[ids[aim]],550-256*sc,foot-352*sc,512*sc,384*sc);
 // 낮은 턱은 뒤에 유지하고, 좌우 돌 기둥 부분만 앞 가림으로 다시 그린다.
 if(get('front').checked){const band=Math.round(r[2]*.27);c.drawImage(images.parapet_cannon_front,r[0],r[1],band,r[3],50,ry,rw*.27,rh);c.drawImage(images.parapet_cannon_front,r[0]+r[2]-band,r[1],band,r[3],50+rw*.73,ry,rw*.27,rh);}
 if(get('soldiers').checked){for(const [id,x]of [['archer',175],['gunner',925]]){const b=assets[id].rect,h=145,w=h*b[2]/b[3];c.drawImage(images[id],...b,x-w/2,250-h,w,h);}}
 c.font='bold 19px sans-serif';c.fillStyle='#fff1c6';c.textAlign='center';c.fillText('궁수 자리',175,280);c.fillText('대포 전용 넓은 사격구',550,490);c.fillText('총병 자리',925,280);
 for(const s of shots){s.age+=dt;const t=s.age;const x=s.x+s.dx*t,y=s.y-170*t+25*t*t;c.drawImage(images.ball,x-7,y-7,14,14);}const old=shots.length;shots=shots.filter(s=>s.age<1.4);if(shots.length!==old)status();}requestAnimationFrame(draw);}status();requestAnimationFrame(draw);
</script></html>
