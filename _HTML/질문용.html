<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문용</title>
<style>
:root { --bg:#f6f2ea; --ink:#2b241c; --muted:#7a6e5f; --line:#ddd3c3; --accent:#9a6b1f; --card:#fffdf8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d1813; --ink:#efe3cc; --muted:#a8977c; --line:#3a3128; --accent:#d4a64a; --card:#26201a; } }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Malgun Gothic", sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
h1 { font-size:22px; margin:0 0 4px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
.q { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin:16px 0; }
.q h2 { font-size:17px; margin:0 0 6px; }
.q h2 span { color:var(--accent); margin-right:6px; }
.q p { margin:4px 0 10px; }
.pics { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:10px; }
figure { margin:0; }
figure img { width:100%; border-radius:6px; border:1px solid var(--line); display:block; }
figcaption { font-size:13px; color:var(--muted); margin-top:4px; }
.rec { font-size:13px; color:var(--accent); }
ol.rest li { margin:4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>질문용</h1>
  <div class="sub">사진을 보고 답해 주실 질문만 모았습니다. 답을 주시면 반영하고 그 질문은 지웁니다. 마지막 갱신 2026-10-22.</div>

  <div class="q">
    <h2>지금 사진으로 기다리는 질문 없음</h2>
  </div>

  <div class="q">
    <h2>그 밖에 답을 기다리는 질문 (사진 없음)</h2>
    <ol class="rest">
      <li>유니티 공식 명령줄 도구와 클로드 코드용 유니티 공식 확장을 설치할까요? (설치 = 설정 변경이라 허락 필요. 지금 작업 묶음이 끝난 뒤 본 폴더에서 시험해 보기 추천)</li>
    </ol>
  </div>
</div>
</body>
</html>
