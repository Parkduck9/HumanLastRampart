<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-134 주인공 걷기 발</title>
<style>body{font:16px system-ui;background:#202329;color:#eee;margin:2rem}h1{font-size:1.6rem}.row{display:flex;flex-wrap:wrap;gap:2rem}.card{background:#34383e;padding:1rem;border-radius:8px}.sprite{width:288px;height:384px;background-repeat:no-repeat;image-rendering:pixelated;background-color:#565d62}.before{background-image:url('../../Game/Assets/_Project/Art/Characters/Hero/hero_walk_run_grid.png')}.after{background-image:url('../../Docs/References/codex_k134_v1/hero_walk_run_grid.png')}img{width:288px;max-width:100%;image-rendering:pixelated}button{font:inherit;padding:.4rem .8rem}a{color:#b8d9ff}</style>
<h1>주인공 옆 걷기 발 비교</h1><p>1행의 1·3번 프레임에서 화면 오른쪽 장화 끝을 수정했습니다. 두 화면은 같은 프레임으로 움직입니다.</p><button id="toggle">일시 정지</button> <span id="frame"></span>
<div class="row"><section class="card"><h2>현재 게임</h2><div class="sprite before"></div></section><section class="card"><h2>수정안</h2><div class="sprite after"></div></section></div>
<h2>수정 프레임 확대 비교</h2><div class="row"><section class="card"><h3>1번: 수정 전 / 후</h3><img src="../../Docs/References/codex_k134_v1/walk_r1_f1_before_4x.png" alt="1번 수정 전"><img src="../../Docs/References/codex_k134_v1/walk_r1_f1_after_4x.png" alt="1번 수정 후"></section><section class="card"><h3>3번: 수정 전 / 후</h3><img src="../../Docs/References/codex_k134_v1/walk_r1_f3_before_4x.png" alt="3번 수정 전"><img src="../../Docs/References/codex_k134_v1/walk_r1_f3_after_4x.png" alt="3번 수정 후"></section></div><p><a href="../../Docs/References/codex_k134_v1/README.md">변경 수와 검사 내역</a></p>
<script>let f=0,playing=true;function draw(){document.querySelectorAll('.sprite').forEach(e=>e.style.backgroundPosition=`-${f*288}px -384px`);document.querySelector('#frame').textContent=`프레임 ${f}`;}draw();setInterval(()=>{if(playing){f=(f+1)%4;draw()}},180);document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'일시 정지':'재생'};</script></html>
