<!doctype html><html lang="ko"><meta charset="utf-8"><title>K-138 앞뒤 걷기 검토</title><style>body{font:16px sans-serif;background:#202329;color:#eee;margin:2rem}h1{color:#e5bb76}.warning{background:#633a28;padding:1em}.grid{display:flex;gap:2em;flex-wrap:wrap}.sprite{width:288px;height:384px;background-color:#696969;background-repeat:no-repeat;image-rendering:pixelated}.frame{display:inline-block;text-align:center}img{width:100%;image-rendering:pixelated}button{font-size:1rem;padding:.5em}</style><h1>주인공 앞뒤 걷기 다리</h1><p class="warning">미완료: 조건에 맞는 새 다리를 완성하지 못해 모든 앞·뒤 칸을 현재 그림 그대로 보존했습니다. 아래의 새 그림은 대체본이며 현재 그림과 동일합니다.</p><button id="toggle">일시 정지</button><div id="cycles"></div><h2>흰머리 참고 · 현재 · 대체본 (2배)</h2><img src="../../Docs/References/codex_k138_v1/comparison.png" alt="뒤와 앞 걷기 네 칸씩의 참고, 현재, 대체본 비교"><p><a href="../../Docs/References/codex_k138_v1/README.md">검사와 미완료 내용</a></p><script>
const sources=['../../Docs/References/hero_history/2_10-21_%ED%9D%B0%EB%A8%B8%EB%A6%AC_%EC%8B%9C%ED%8A%B8.png','../../Game/Assets/_Project/Art/Characters/Hero/hero_walk_run_grid.png','../../Docs/References/codex_k138_v1/hero_walk_run_grid.png'];const root=document.querySelector('#cycles');for(const [label,row] of [['뒷모습',0],['앞모습',3]]){const h=document.createElement('h2');h.textContent=label;root.append(h);const grid=document.createElement('div');grid.className='grid';sources.forEach((src,i)=>{const box=document.createElement('div');box.className='frame';const cap=document.createElement('p');cap.textContent=['흰머리 참고','현재 게임','대체본'][i];const sprite=document.createElement('div');sprite.className='sprite';sprite.style.backgroundImage=`url("${src}")`;sprite.dataset.row=row;box.append(cap,sprite);grid.append(box)});root.append(grid)}let frame=0,playing=true;function draw(){document.querySelectorAll('.sprite').forEach(x=>x.style.backgroundPosition=`${-frame*288}px ${-Number(x.dataset.row)*384}px`)}draw();setInterval(()=>{if(playing){frame=(frame+1)%4;draw()}},180);document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시 정지':'재생'};
</script></html>
