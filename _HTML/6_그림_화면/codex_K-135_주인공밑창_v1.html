<!doctype html><html lang="ko"><meta charset="utf-8"><title>K-135 밑창 중간 시안</title><style>body{background:#1d1d20;color:#eee;font:16px system-ui;margin:2rem}h1{font-size:1.5rem}.warning{color:#ffce7b}.grid{display:grid;grid-template-columns:repeat(2,minmax(290px,1fr));gap:1rem}.tile{background:#353336;padding:1rem}.sprite{width:288px;height:384px;background-color:#777066;background-repeat:no-repeat;image-rendering:pixelated}</style><h1>K-135 밑창 중간 시안</h1><p class="warning">미완성: 앞·뒤 다리 연결과 옆 방향 노멀 맵을 추가로 수정해야 합니다. 게임 반영용 결과물이 아닙니다.</p><p>왼쪽은 현재 게임 원본, 오른쪽은 시안입니다. 돌바닥색 위에서 4프레임을 순서대로 재생합니다.</p><div id="panels"></div><script>const root='../../Docs/References/codex_k135_v1/hero_walk_run_grid.png',old='../../Game/Assets/_Project/Art/Characters/Hero/hero_walk_run_grid.png';const names=['뒤쪽 걷기','옆걸음','옆 달리기','앞쪽 걷기'];const el=document.getElementById('panels');names.forEach((n,r)=>{const h=document.createElement('h2');h.textContent=n;el.append(h);const g=document.createElement('div');g.className='grid';[old,root].forEach((src,i)=>{const box=document.createElement('div');box.className='tile';const label=document.createElement('p');label.textContent=i?'수정 시안':'현재 게임';const s=document.createElement('div');s.className='sprite';s.style.backgroundImage=`url("${src}")`;s.dataset.row=r;box.append(label,s);g.append(box)});el.append(g)});let frame=0;function tick(){document.querySelectorAll('.sprite').forEach(s=>s.style.backgroundPosition=`-${frame*288}px -${s.dataset.row*384}px`);frame=(frame+1)%4}tick();setInterval(tick,180);</script></html>
