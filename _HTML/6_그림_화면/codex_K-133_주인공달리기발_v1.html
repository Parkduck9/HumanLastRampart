<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-133 달리기 발 비교</title><style>
body{margin:0;background:#171d25;color:#eee7d7;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px}h1{color:#ffd489}p{line-height:1.6}.pair{display:flex;flex-wrap:wrap;gap:20px}.panel{background:#28313b;padding:16px;border-radius:12px}.sprite{width:288px;height:384px;background-repeat:no-repeat;image-rendering:pixelated;background-color:#39434c}.before{background-image:url('../../Game/Assets/_Project/Art/Characters/Hero/hero_walk_run_grid.png')}.after{background-image:url('../../Docs/References/codex_k133_v1/hero_walk_run_grid.png')}button{padding:9px 15px;margin-right:8px}img{width:100%;image-rendering:pixelated;background:#39434c}a{color:#ffd489}
</style></head><body><main><h1>K-133 주인공 달리기 발</h1><p>왼쪽은 현재 게임 시트, 오른쪽은 수정본입니다. 위에서 세 번째 줄의 1·2번 칸에서 잘린 뒤쪽 부츠를 이어 그렸습니다. 두 영상은 같은 프레임을 동시에 표시합니다.</p><p><button id="toggle">일시 정지</button><button id="step">한 칸씩 보기</button><span id="frame"></span></p><div class="pair"><div class="panel"><h2>수정 전</h2><div class="sprite before"></div></div><div class="panel"><h2>수정 후</h2><div class="sprite after"></div></div></div><h2>1·2번 칸 확대 비교</h2><p>각 이미지는 원본 픽셀을 4배로 확대한 것입니다.</p><h3>수정 전</h3><img src="../../Docs/References/codex_k133_v1/before_frames_1_2_4x.png" alt="수정 전 1번과 2번 칸"><h3>수정 후</h3><img src="../../Docs/References/codex_k133_v1/after_frames_1_2_4x.png" alt="수정 후 1번과 2번 칸"><p><a href="../../Docs/References/codex_k133_v1/README.md">픽셀 비교와 검사 결과</a></p></main><script>
let f=0, playing=true;function draw(){document.querySelectorAll('.sprite').forEach(e=>e.style.backgroundPosition=`${-288*f}px -768px`);document.getElementById('frame').textContent=`현재 ${f}번 칸`;}draw();setInterval(()=>{if(playing){f=(f+1)%4;draw()}},180);document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'일시 정지':'재생'};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('toggle').textContent='재생';f=(f+1)%4;draw()};
</script></body></html>
